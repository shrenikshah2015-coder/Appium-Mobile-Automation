
name: Appium Mobile Automation Tests

on:
  workflow_dispatch:

jobs:
  appium-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Enable Android emulator hardware acceleration
        run: |
          ls -l /dev/kvm
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Start Android Emulator and Appium
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PLATFORM_NAME: Android
          DEVICE_NAME: "Android Emulator"
          ANDROID_UDID: emulator-5554
          CALCULATOR_PACKAGE: com.darkempire78.opencalculator
          CALCULATOR_ACTIVITY: .activities.MainActivity
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          avd-name: test
          force-avd-creation: true
          emulator-boot-timeout: 600
          emulator-port: 5554
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            bash run-appium-tests.sh

      - name: Upload Appium server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-server-logs
          path: appium.log
          if-no-files-found: ignore

      - name: Upload calculator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calculator-screenshots
          path: step*-calculator.png
          if-no-files-found: warn

      - name: Upload Android diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-diagnostic-logs
          path: |
            android-logcat.txt
            android-activities.txt
          if-no-files-found: ignore

      - name: Upload Mochawesome HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-html-report
          path: mochawesome-report/
          if-no-files-found: warn
