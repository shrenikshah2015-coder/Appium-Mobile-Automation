name: Appium Mobile Automation Tests

on:
  workflow_dispatch:

jobs:
  appium-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Enable Android emulator hardware acceleration
        run: |
          ls -l /dev/kvm
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Start Android Emulator and Appium
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PLATFORM_NAME: Android
          DEVICE_NAME: "Android Emulator"
          ANDROID_UDID: emulator-5554
          CALCULATOR_PACKAGE: com.darkempire78.opencalculator
          CALCULATOR_ACTIVITY: .activities.MainActivity
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          avd-name: test
          force-avd-creation: true
          emulator-boot-timeout: 600
          emulator-port: 5554
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            echo "========== CI CONFIGURATION CHECK =========="
            echo "PLATFORM_NAME=$PLATFORM_NAME"
            echo "DEVICE_NAME=$DEVICE_NAME"
            echo "ANDROID_UDID=$ANDROID_UDID"
            echo "CALCULATOR_PACKAGE=$CALCULATOR_PACKAGE"
            echo "CALCULATOR_ACTIVITY=$CALCULATOR_ACTIVITY"
            echo "Checking Android emulator"
            adb devices
            echo "Downloading OpenCalc APK"
            curl -L --fail --retry 3 --retry-delay 2 -o OpenCalc.v3.2.1.apk https://github.com/clementwzk/OpenCalc/releases/download/v3.2.1/OpenCalc.v3.2.1.apk
            echo "Installing OpenCalc APK"
            adb install -r OpenCalc.v3.2.1.apk
            echo "Resolving calculator activity"
            adb shell cmd package resolve-activity --brief "$CALCULATOR_PACKAGE"
            echo "Installing Appium"
            npm install -g appium
            echo "Installing UiAutomator2 driver"
            appium driver install uiautomator2
            echo "Starting Appium server"
            nohup appium --address 127.0.0.1 --port 4723 > appium.log 2>&1 < /dev/null &
            sleep 15
            echo "Checking Appium server status"
            curl --fail http://127.0.0.1:4723/status
            echo "Running Appium tests with failure diagnostics"
            bash run-appium-tests.sh

      - name: Upload Appium server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-server-logs
          path: appium.log
          if-no-files-found: ignore

      - name: Upload calculator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calculator-screenshots
          path: step*-calculator.png
          if-no-files-found: warn

      - name: Upload Android diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-diagnostic-logs
          path: |
            android-logcat.txt
            android-activities.txt
          if-no-files-found: ignore

      - name: Upload Mochawesome HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-html-report
          path: mochawesome-report/
          if-no-files-found: warn