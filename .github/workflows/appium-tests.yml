name: Appium Mobile Automation Tests

on:
  workflow_dispatch:

jobs:
  appium-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Enable Android emulator hardware acceleration
        run: |
          ls -l /dev/kvm
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Start Android Emulator and Appium
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          avd-name: test
          force-avd-creation: true
          emulator-boot-timeout: 600
          emulator-port: 5554
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            export CALCULATOR_PACKAGE=com.darkempire78.opencalculator
            export CALCULATOR_ACTIVITY=.activities.MainActivity
            export ANDROID_UDID=emulator-5554

            echo "Checking Android emulator"
            adb devices

            echo "Checking installed calculator applications"
            adb shell pm list packages | grep -i calculator || true

            echo "Downloading OpenCalc APK"
            curl -L --fail -o OpenCalc.apk "https://github.com/clementwzk/OpenCalc/releases/download/v3.2.1/OpenCalc.v3.2.1.apk"

            echo "Installing OpenCalc on Android Emulator"
            adb install OpenCalc.apk

            echo "Verifying OpenCalc installation"
            adb shell pm list packages | grep -i opencalc || true

            echo "Checking OpenCalc launch activity"
            adb shell cmd package resolve-activity --brief com.darkempire78.opencalculator

            echo "Installing Appium"
            npm install -g appium

            echo "Installing UiAutomator2"
            appium driver install uiautomator2

            echo "Starting Appium server"
            nohup appium --address 127.0.0.1 --port 4723 > appium.log 2>&1 &

            sleep 15

            echo "Checking Appium server"
            curl --fail http://127.0.0.1:4723/status

            echo "Checking OpenCalc package details"
            adb shell dumpsys package com.darkempire78.opencalculator | grep -E 'Activity|MAIN|LAUNCHER'

            echo "Running Appium Mocha tests"
            npm run test:report

      - name: Upload Appium server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-server-logs
          path: appium.log
          if-no-files-found: ignore

      - name: Upload calculator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calculator-screenshots
          path: step*-calculator.png
          if-no-files-found: warn

      - name: Upload Mochawesome HTML report
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: mochawesome-html-report
            path: mochawesome-report/
            if-no-files-found: warn