
name: Appium Mobile Automation Tests

on:
  workflow_dispatch:

jobs:
  appium-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Start Android Emulator and Appium
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
           
          script: |
            echo "Checking Android emulator"
            adb devices

            echo "Installing Appium"
            npm install -g appium

            echo "Installing UiAutomator2"
            appium driver install uiautomator2

            echo "Starting Appium server"
            appium --address 127.0.0.1 --port 4723 > appium.log 2>&1 &

            echo "Waiting for Appium server"

            n=1
            while [ "$n" -le 60 ]; do
              if curl -s http://127.0.0.1:4723/status | grep -q '"ready":true'; then
                echo "Appium server is ready"
                break
              fi

              echo "Waiting... attempt $n"
              sleep 2
              n=$((n + 1))
            done

            if [ "$n" -gt 60 ]; then
              echo "Appium server failed to start"
              cat appium.log
              exit 1
            fi

            curl --fail http://127.0.0.1:4723/status
      - name: Upload Appium server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-server-logs
          path: appium.log
          if-no-files-found: ignore
